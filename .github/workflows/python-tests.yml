name: Selenium Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Instalar ChromeDriver
        uses: nanasess/setup-chromedriver@master

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas en modo Headless
        run: |
          pytest test_tienda.py test_pom.py --html=reporte_final.html --self-contained-html

      - name: Guardar el Reporte HTML como evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-selenium
          path: reporte_final.html

